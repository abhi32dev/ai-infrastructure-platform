<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Openings Aggregator — Native Tech Job Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <!-- Header Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg shadow-emerald-500/20">
          OA
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">
            Openings Aggregator
          </h1>
          <p class="text-xs text-slate-400">Direct ATS Engine (Greenhouse • Ashby • Lever)</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button id="btnHarvest" onclick="triggerHarvest()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center space-x-2 shadow-lg shadow-emerald-500/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Fetch Live Openings</span>
        </button>
        <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-lg text-sm border border-slate-700 transition">
          Export CSV
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Ad-hoc Instruction Prompt Bar -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
      <label class="block text-sm font-semibold text-emerald-400 mb-2">⚡ Ad-Hoc Instruction Prompt & Query</label>
      <div class="flex space-x-3">
        <input type="text" id="inputQuery" placeholder="e.g. Senior Python, AWS, Distributed Systems in San Francisco or Remote" 
               class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition text-sm">
        <button onclick="fetchJobs()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold px-6 py-3 rounded-xl border border-slate-700 transition text-sm">
          Search Jobs
        </button>
      </div>

      <!-- Quick Filter Chips -->
      <div class="flex flex-wrap items-center gap-2 mt-4 text-xs">
        <span class="text-slate-500">Quick Filters:</span>
        <button onclick="setQuery('Python')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">Python</button>
        <button onclick="setQuery('Staff Backend')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">Staff Backend</button>
        <button onclick="setQuery('Distributed Systems')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">Distributed Systems</button>
        <button onclick="setQuery('San Francisco')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">San Francisco</button>
        <button onclick="setQuery('Remote')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">Remote Only</button>
      </div>
    </div>

    <!-- Status Banner -->
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

    <!-- Job Table Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="p-6 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-100">Direct ATS Openings</h2>
          <p id="txtCount" class="text-xs text-slate-400 mt-0.5">Showing 0 jobs</p>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-slate-400 text-xs uppercase font-semibold border-b border-slate-800">
            <tr>
              <th class="px-6 py-4">Company</th>
              <th class="px-6 py-4">Job Title</th>
              <th class="px-6 py-4">Location</th>
              <th class="px-6 py-4">ATS Engine</th>
              <th class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="jobList" class="divide-y divide-slate-800/60">
            <!-- Dynamic Job Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Job Description Modal -->
  <div id="descModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-6 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold text-slate-100">Job Title</h3>
          <p id="modalSub" class="text-xs text-emerald-400 mt-1">Company • Location</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">&times;</button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto text-sm text-slate-300 space-y-4 leading-relaxed">
        <!-- Description text -->
      </div>
      <div class="p-4 border-t border-slate-800 bg-slate-950 flex justify-end space-x-3">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white text-sm">Close</button>
        <a id="modalApplyBtn" href="#" target="_blank" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition">Visit Direct Apply Posting ↗</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
