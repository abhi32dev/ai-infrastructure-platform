apiVersion: ray.io/v10
kind: RayCluster
metadata:
  name: ray-ai-compute-cluster
  namespace: ai-platform
spec:
  rayVersion: '2.35.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:latest-py310
          resources:
            limits:
              cpu: "4"
              memory: "16Gi"
            requests:
              cpu: "2"
              memory: "8Gi"
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
  workerGroupSpecs:
  - groupName: gpu-workers
    replicas: 4
    minReplicas: 2
    maxReplicas: 16
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:latest-py310-gpu
          resources:
            limits:
              nvidia.com/gpu: "8"
              memory: "64Gi"
              cpu: "32"
            requests:
              nvidia.com/gpu: "8"
              memory: "32Gi"
              cpu: "16"
