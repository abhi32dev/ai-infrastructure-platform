apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-cost-router
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-cost-router
  template:
    metadata:
      labels:
        app: rag-cost-router
    spec:
      containers:
      - name: rag-router-container
        image: ai-platform/rag-cost-router:latest
        ports:
        - containerPort: 8001
          name: http
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-cost-router-service
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app: rag-cost-router
  ports:
  - port: 8001
    targetPort: 8001
    name: http
