<svg viewBox="0 0 1000 750" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean, Solid Dark Background (NO GRID OVERLAY) -->
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>

  <!-- Header Text -->
  <text x="500" y="32" text-anchor="middle" fill="#ffffff" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="20">Project 12: GenAI Gateway & Semantic Cache</text>
  <text x="500" y="54" text-anchor="middle" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="13">2D Control Flow Architecture Blueprint</text>

  <!-- 1. Start Node -->
  <g transform="translate(340, 75)">
    <rect width="320" height="42" rx="21" fill="#092e20" stroke="#34d399" stroke-width="2"/>
    <text x="160" y="26" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="13">▶ GenAIGateway.process_prompt()</text>
  </g>

  <path d="M 500 117 L 500 150" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Step 1 Process Node -->
  <g transform="translate(320, 150)">
    <rect width="360" height="50" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="13">Check Client Token-Bucket Capacity</text>
    <text x="180" y="38" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">src/genai_gateway.py:L50</text>
  </g>

  <path d="M 500 200 L 500 235" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- DECISION 1 DIAMOND -->
  <g transform="translate(500, 275)">
    <polygon points="0,-40 180,0 0,40 -180,0" fill="#1f1906" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow-gold)"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="700" font-size="11">DECISION 1</text>
    <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="11">Token Bucket Capacity > 0?</text>
    <text x="0" y="24" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="9">(Rate Limiting Policy)</text>
  </g>

  <!-- LEFT BRANCH: Fast Path / Cache Hit -->
  <path d="M 320 275 L 170 275 L 170 345" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="200" y="255" width="100" height="20" rx="4" fill="#092e20" stroke="#34d399" stroke-width="1"/>
  <text x="250" y="269" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-weight="600" font-size="10">NO (Exceeded)</text>

  <!-- Left Action Box -->
  <g transform="translate(30, 350)">
    <rect width="280" height="50" rx="8" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="12">Reject Request with HTTP 429</text>
    <text x="140" y="38" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10">Too Many Requests Policy</text>
  </g>

  <path d="M 170 400 L 170 445" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(40, 445)">
    <rect width="260" height="40" rx="20" fill="#092e20" stroke="#34d399" stroke-width="2"/>
    <text x="130" y="25" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="12">✖ Rate Limit Blocked</text>
  </g>

  <!-- DOWN BRANCH: Proceed Execution -->
  <path d="M 500 315 L 500 350" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="510" y="320" width="100" height="20" rx="4" fill="#161b22" stroke="#38bdf8" stroke-width="1"/>
  <text x="560" y="334" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="600" font-size="10">YES (Allowed)</text>

  <!-- Step 2 Box -->
  <g transform="translate(320, 350)">
    <rect width="360" height="50" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="13">Search ChromaDB Vector Semantic Cache</text>
    <text x="180" y="38" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">VectorSemanticCache.lookup()</text>
  </g>

  <path d="M 500 400 L 500 445" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- DECISION 2 DIAMOND -->
  <g transform="translate(500, 485)">
    <polygon points="0,-40 180,0 0,40 -180,0" fill="#1f1906" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow-gold)"/>
    <text x="0" y="-10" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="700" font-size="11">DECISION 2</text>
    <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="11">Vector Cache Similarity >= 0.92?</text>
    <text x="0" y="24" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="9">(Cosine Distance Metric)</text>
  </g>

  <!-- DOWN BRANCH: Success -->
  <path d="M 500 525 L 500 565" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="510" y="530" width="100" height="20" rx="4" fill="#092e20" stroke="#34d399" stroke-width="1"/>
  <text x="560" y="544" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-weight="600" font-size="10">YES (Cache Hit)</text>

  <!-- Success Box -->
  <g transform="translate(320, 565)">
    <rect width="360" height="50" rx="8" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="180" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="13">Return Cached Response Payload</text>
    <text x="180" y="38" text-anchor="middle" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="11"><5ms Latency / $0.00 Cost</text>
  </g>

  <path d="M 500 615 L 500 655" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(340, 655)">
    <rect width="320" height="42" rx="21" fill="#092e20" stroke="#34d399" stroke-width="2"/>
    <text x="160" y="26" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="13">★ Semantic Cache Hit</text>
  </g>

  <!-- RIGHT BRANCH: Error / Retry Branch -->
  <path d="M 680 485 L 840 485" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="695" y="465" width="80" height="20" rx="4" fill="#3b1219" stroke="#f43f5e" stroke-width="1"/>
  <text x="735" y="479" text-anchor="middle" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-weight="600" font-size="10">NO (Cache Miss)</text>

  <!-- Decision 3 Diamond (Right Side) -->
  <g transform="translate(840, 565)">
    <polygon points="0,-35 110,0 0,35 -110,0" fill="#1f1906" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="700" font-size="10">DECISION 3</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Primary Failed?</text>
  </g>

  <!-- UPWARD RETRY LOOP ARROW -->
  <path d="M 840 530 L 840 375 L 695 375" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <rect x="710" y="355" width="120" height="20" rx="4" fill="#2d2206" stroke="#fbbf24" stroke-width="1"/>
  <text x="770" y="369" text-anchor="middle" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-weight="600" font-size="9">↻ YES: Fallback Cascade</text>

  <!-- DOWN BRANCH: Fallback Action -->
  <path d="M 840 600 L 840 645" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="850" y="610" width="80" height="20" rx="4" fill="#3b1219" stroke="#f43f5e" stroke-width="1"/>
  <text x="890" y="624" text-anchor="middle" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-weight="600" font-size="10">NO (Secondary Fail)</text>

  <g transform="translate(710, 645)">
    <rect width="260" height="50" rx="8" fill="#161b22" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="130" y="22" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="600" font-size="12">Fallback to Secondary LLM Provider</text>
    <text x="130" y="38" text-anchor="middle" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="10">Zero Downtime Provider Routing</text>
  </g>
</svg>